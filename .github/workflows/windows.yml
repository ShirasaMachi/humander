name: Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-package-lock
      - run: npm test
      - run: npm pack --ignore-scripts --dry-run
      - run: npm ci --ignore-scripts
        working-directory: workbuddy
      - run: npm run build
        working-directory: workbuddy
      - run: npm test
        working-directory: workbuddy
        env:
          HUMANDER_MCP_STDIO_TEST: '1'
